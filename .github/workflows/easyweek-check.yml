name: EasyWeek check

# Compares the Studio (barbers, EasyWeek ids, services, prices) with what EasyWeek shows for the Dnipro branch, and
# saves who can be booked to the Studio's "Barber availability" document (the site hides the others).
# It never changes EasyWeek. Free: two short runs a day. It fails (and GitHub emails the repository owner) when
# something drifted or looks broken.
# A scheduled run only starts from the default branch; "Run workflow" in the Actions tab starts it by hand.
on:
  schedule:
    - cron: "0 5,11 * * *" # twice a day: 05:00 UTC (07:00 or 08:00 in Dnipro, before the shop opens) and 11:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Studio against EasyWeek
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: j0lzx1oo
      NEXT_PUBLIC_SANITY_DATASET: production
      # An Editor token for the owner's Sanity project, stored as a repository secret (docs/easyweek-check.md).
      # Without it the run is a dry run: it reports and saves nothing.
      SANITY_AVAILABILITY_TOKEN: ${{ secrets.SANITY_AVAILABILITY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the check
        run: npm run check:easyweek
